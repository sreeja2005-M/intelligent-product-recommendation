# Netlify Configuration File
# Serves static frontend from the 'frontend' directory

[build]
  publish = "frontend"

# SPA / Static route fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers to ensure immediate JS update
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
