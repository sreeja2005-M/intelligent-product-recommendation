# Netlify Configuration File
# Serves static frontend from the 'frontend' directory and serverless functions

[build]
  publish = "frontend"
  functions = "netlify/functions"

# API Route redirect to serverless Netlify function
[[redirects]]
  from = "/api/analyze-full"
  to = "/.netlify/functions/analyze"
  status = 200

# SPA / Static route fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers to ensure immediate JS update
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
